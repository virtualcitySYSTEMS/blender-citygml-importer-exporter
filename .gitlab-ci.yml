# =============================================================================
# GitLab CI/CD Pipeline - CityGML Importer/Exporter Blender Add-on
# =============================================================================
# Stages follow VCS DevOps conventions:
#   build → test → version → bundle → deploy
#
# Pipeline triggers:
#   - Push to master/release-*/hotfix-*: full pipeline
#   - Merge request: build + test only
#   - Tags (v*): bundle + deploy

# ---------------------------------------------------------------------------
# Workflow: Prevent duplicate pipelines (MR + push)
# For release/hotfix branches: always use branch pipeline (full CI)
# For feature branches: prefer MR pipeline (build+test only)
# ---------------------------------------------------------------------------
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^release-v/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^hotfix-/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - version
  - bundle
  - deploy

variables:
  ADDON_NAME: "citygml-importer-exporter"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_STRATEGY: fetch

.publish_only_template: &publish_only
  refs:
    - /^(main|release-v.*)$/
  variables:
    - $PUBLISH

# ---------------------------------------------------------------------------
# Cache: Dependencies are cached based on the hash of dependencies.yaml
# ---------------------------------------------------------------------------
.deps_cache:
  cache:
    key:
      files:
        - dependencies.yaml
    paths:
      - 3dcitydb-tool-v4/
      - citydb-tool-*/
      - vcdb-tool-*/
      - python_deps/
      - .cache/pip
    policy: pull-push

# ---------------------------------------------------------------------------
# Stage: build - Fetch all external dependencies
# ---------------------------------------------------------------------------
build:
  stage: build
  image: python:3.11-slim
  tags:
    - linux-2.0
  extends: .deps_cache
  script:
    - pip install --quiet pyyaml
    - python scripts/fetch_deps.py --manifest dependencies.yaml --output-dir .
  artifacts:
    paths:
      - 3dcitydb-tool-v4/
      - citydb-tool-*/
      - vcdb-tool-*/
      - python_deps/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release-v/
    - if: $CI_COMMIT_BRANCH =~ /^hotfix-/

# ---------------------------------------------------------------------------
# Stage: test - Validate manifest and basic sanity checks
# ---------------------------------------------------------------------------
test:manifest:
  stage: test
  image: python:3.11-slim
  tags:
    - linux-2.0
  needs:
    - job: build
      optional: true
  script:
    - pip install --quiet pyyaml
    - |
      python -c "
      import yaml, sys
      from pathlib import Path
      m = yaml.safe_load(Path('dependencies.yaml').read_text())
      tools = m.get('tools', {})
      modules = m.get('python_modules', [])
      errors = []
      for name, spec in tools.items():
          if not spec.get('version'):
              errors.append(f'Tool {name}: missing version')
          if not spec.get('url'):
              errors.append(f'Tool {name}: missing url')
      for mod in modules:
          if not mod.get('name') or not mod.get('version'):
              errors.append(f'Python module entry incomplete: {mod}')
      if errors:
          print('Manifest validation FAILED:')
          for e in errors:
              print(f'  - {e}')
          sys.exit(1)
      print(f'Manifest OK: {len(tools)} tools, {len(modules)} python modules')
      "
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - dependencies.yaml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release-v/

# ---------------------------------------------------------------------------
# Test: Pure Python unit tests for parser/helper logic
# ---------------------------------------------------------------------------
test:python-unit:
  stage: test
  image: python:3.11-slim
  tags:
    - linux-2.0
  script:
    - pip install --quiet pytest
    - cd scripts/tests/unit
    - python -m pytest -q --rootdir=. .
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release-v/
    - if: $CI_COMMIT_BRANCH =~ /^hotfix-/

# ---------------------------------------------------------------------------
# Test: Blender Add-on (activate, import, export)
# ---------------------------------------------------------------------------
test:blender:
  stage: test
  image: ubuntu:24.04
  tags:
    - linux-2.0
  needs:
    - job: build
      artifacts: true
  variables:
    BLENDER_VERSION: "5.0.1"
    BLENDER_URL: "https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz"
  before_script:
    - apt-get update -qq && apt-get install -qq -y wget xz-utils libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 libxext6 libx11-6 libglib2.0-0 > /dev/null
    - wget -q "${BLENDER_URL}" -O /tmp/blender.tar.xz
    - tar -xf /tmp/blender.tar.xz -C /opt/
    - ln -s /opt/blender-${BLENDER_VERSION}-linux-x64/blender /usr/local/bin/blender
    - rm /tmp/blender.tar.xz
    # Install lxml + pyproj into Blender's bundled Python
    - BLENDER_PYTHON=/opt/blender-${BLENDER_VERSION}-linux-x64/${BLENDER_VERSION%.*}/python/bin/python3*
    - ${BLENDER_PYTHON} -m ensurepip --upgrade 2>/dev/null || true
    - ${BLENDER_PYTHON} -m pip install --quiet --no-warn-script-location lxml pyproj
    # Install add-on into Blender's user scripts path
    - mkdir -p /root/.config/blender/${BLENDER_VERSION%.*}/scripts/addons/${ADDON_NAME}
    - cp -r . /root/.config/blender/${BLENDER_VERSION%.*}/scripts/addons/${ADDON_NAME}/
    # Remove bundled modules (lxml/pyproj are installed via pip above for CI)
    - rm -rf /root/.config/blender/${BLENDER_VERSION%.*}/scripts/addons/${ADDON_NAME}/Python_Module
    - rm -rf /root/.config/blender/${BLENDER_VERSION%.*}/scripts/addons/${ADDON_NAME}/python_deps
  script:
    - echo "=== Test 1/5 - Plugin aktivieren ==="
    - blender --background --python scripts/tests/test_activate.py
    - echo "=== Test 2/5 - Import alle Feature-Typen ==="
    - blender --background --addons ${ADDON_NAME} --python scripts/tests/test_import.py -- --dir test_files
    - echo "=== Test 3/5 - Import Contracts ==="
    - blender --background --addons ${ADDON_NAME} --python scripts/tests/test_import_contract.py -- --dir test_files
    - echo "=== Test 4/5 - Import Filter ==="
    - blender --background --addons ${ADDON_NAME} --python scripts/tests/test_import_filters.py -- --dir test_files
    - echo "=== Test 5/5 - Export alle Feature-Typen ==="
    - blender --background --addons ${ADDON_NAME} --python scripts/tests/test_export.py -- --dir test_files
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^release-v/
    - if: $CI_COMMIT_BRANCH =~ /^hotfix-/

# ---------------------------------------------------------------------------
# Stage: version - Bump version (release/master only)
# ---------------------------------------------------------------------------
version:bump:
  stage: version
  only:
    <<: *publish_only
  image: python:3.11-slim
  tags:
    - linux-2.0
  before_script:
    - apt-get update -qq && apt-get install -qq -y git > /dev/null
    - git config user.email "ci@virtualcitysystems.de"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git checkout "$CI_COMMIT_BRANCH"
  script:
    - |
      python scripts/version_bump.py
      VERSION=$(python -c "from scripts.version_bump import get_current_version; print(get_current_version())" 2>/dev/null || echo "unknown")
      echo "VERSION=${VERSION}" >> build.env
      git add __init__.py version.json blender_manifest.toml
      git commit -m "chore: bump version to ${VERSION} [skip ci]" || echo "No version change"
      git push origin "$CI_COMMIT_BRANCH" || echo "Push skipped"
  artifacts:
    reports:
      dotenv: build.env

# ---------------------------------------------------------------------------
# Stage: bundle - Package the add-on ZIPs (INTERN + EXTERN)
# ---------------------------------------------------------------------------
bundle:
  stage: bundle
  only:
    <<: *publish_only
  image: python:3.11-slim
  tags:
    - linux-2.0
  needs:
    - job: build
      artifacts: true
    - job: version:bump
      optional: true
  before_script:
    - apt-get update -qq && apt-get install -qq -y zip rsync curl > /dev/null
  script:
    - |
      # Determine version from version.json
      VERSION=$(python -c "
      import json, pathlib
      v = json.loads(pathlib.Path('version.json').read_text())
      print(f'{v[\"major\"]}.{v[\"minor\"]}.{v[\"patch\"]}')
      ")

      PACKAGE_VERSION="${CI_COMMIT_TAG:-${VERSION}}"
      PACKAGE_VERSION="${PACKAGE_VERSION#v}"

      echo "Packaging ${ADDON_NAME} v${PACKAGE_VERSION}..."

      # Common rsync excludes
      EXCLUDES="--exclude=.git --exclude=build/ --exclude=scripts/ --exclude=devops-how-to-master/ --exclude=test_files/ --exclude=.gitlab-ci.yml --exclude=dependencies.yaml --exclude=.gitignore --exclude=.cache/ --exclude=*.pyc --exclude=__pycache__ --exclude=.dep_version --exclude=*.zip"

      # --- INTERN bundle (with vcdb-tool) ---
      INTERN_DIR="build/${ADDON_NAME}_INTERN"
      mkdir -p "${INTERN_DIR}"
      rsync -a ${EXCLUDES} --exclude='citydb-tool-*/' . "${INTERN_DIR}/"
      # Clear presets content (keep directory)
      rm -f "${INTERN_DIR}/presets/"*.json
      cd build
      zip -r "../${ADDON_NAME}-${PACKAGE_VERSION}_INTERN.zip" "${ADDON_NAME}_INTERN/"
      cd ..

      # --- EXTERN bundle (with citydb-tool, without vcdb-tool) ---
      EXTERN_DIR="build/${ADDON_NAME}_EXTERN"
      mkdir -p "${EXTERN_DIR}"
      rsync -a ${EXCLUDES} --exclude='vcdb-tool-*/' . "${EXTERN_DIR}/"
      # Clear presets content (keep directory)
      rm -f "${EXTERN_DIR}/presets/"*.json
      cd build
      zip -r "../${ADDON_NAME}-${PACKAGE_VERSION}_EXTERN.zip" "${ADDON_NAME}_EXTERN/"
      cd ..

      ls -lh *.zip
      python scripts/tests/check_bundle_contents.py --addon-name "${ADDON_NAME}" --version "${PACKAGE_VERSION}"
      echo "BUNDLE_VERSION=${PACKAGE_VERSION}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

# ---------------------------------------------------------------------------
# Stage: deploy - Push to GitLab Generic Package Registry
# Note: ZIPs are rebuilt here because they exceed the CI artifact size limit.
# ---------------------------------------------------------------------------
deploy:registry:
  stage: deploy
  only:
    <<: *publish_only
  image: python:3.11-slim
  tags:
    - linux-2.0
  needs:
    - job: build
      artifacts: true
    - job: bundle
      artifacts: true
  before_script:
    - apt-get update -qq && apt-get install -qq -y zip rsync curl > /dev/null
  script:
    - |
      # Determine version
      PACKAGE_VERSION="${CI_COMMIT_TAG:-${BUNDLE_VERSION:-0.0.0}}"
      PACKAGE_VERSION="${PACKAGE_VERSION#v}"

      echo "Deploying ${ADDON_NAME} v${PACKAGE_VERSION}..."

      # Common rsync excludes
      EXCLUDES="--exclude=.git --exclude=build/ --exclude=scripts/ --exclude=devops-how-to-master/ --exclude=test_files/ --exclude=.gitlab-ci.yml --exclude=dependencies.yaml --exclude=.gitignore --exclude=.cache/ --exclude=*.pyc --exclude=__pycache__ --exclude=.dep_version --exclude=*.zip"

      # --- Rebuild INTERN bundle ---
      INTERN_DIR="build/${ADDON_NAME}_INTERN"
      mkdir -p "${INTERN_DIR}"
      rsync -a ${EXCLUDES} --exclude='citydb-tool-*/' . "${INTERN_DIR}/"
      # Clear presets content (keep directory)
      rm -f "${INTERN_DIR}/presets/"*.json
      cd build
      zip -r "../${ADDON_NAME}-${PACKAGE_VERSION}_INTERN.zip" "${ADDON_NAME}_INTERN/"
      cd ..

      # --- EXTERN bundle (with citydb-tool, without vcdb-tool) ---
      EXTERN_DIR="build/${ADDON_NAME}_EXTERN"
      mkdir -p "${EXTERN_DIR}"
      rsync -a ${EXCLUDES} --exclude='vcdb-tool-*/' . "${EXTERN_DIR}/"
      # Clear presets content (keep directory)
      rm -f "${EXTERN_DIR}/presets/"*.json
      cd build
      zip -r "../${ADDON_NAME}-${PACKAGE_VERSION}_EXTERN.zip" "${ADDON_NAME}_EXTERN/"
      cd ..

      ls -lh *.zip
      python scripts/tests/check_bundle_contents.py --addon-name "${ADDON_NAME}" --version "${PACKAGE_VERSION}"

      # --- Upload to Package Registry ---
      for ZIP_FILE in *.zip; do
        echo "Publishing ${ZIP_FILE} as ${ADDON_NAME}/${PACKAGE_VERSION}..."
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${ZIP_FILE}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${ADDON_NAME}/${PACKAGE_VERSION}/${ZIP_FILE}"
      done

      echo "Published to Generic Package Registry."

